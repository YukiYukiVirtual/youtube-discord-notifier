<!DOCTYPE html>
<!--
シークレット変換スペース 正本プログラム（youtube-discord-notifier 配布物の一部）


1. このファイルを正本として、フルスタックのスペースを作成すること。
2. 下の PUBLIC_KEY_SPKI_B64 の値 "__PUBLIC_KEY_SPKI_B64__" を、
生成した一時鍵ペアの公開鍵（SPKI 形式、Base64、改行なしの1行）に置換すること。
3. 保存アクションは1つだけ用意すること。そのアクションは
webhook_ct と apikey_ct（いずれも Base64 文字列）を受け取り、
レコードに保存するだけのものにし、このページの
window.__saveCiphertext(webhook_ct, apikey_ct) から呼べるよう接続すること。
アクション側で復号・加工はしないこと。
4. 「暗号化コア」と書かれた部分のロジックは一切変更しないこと
（方式：WebCrypto RSA-OAEP、ハッシュ SHA-256、値はフィールド別に暗号化、出力は Base64）。
5. 外部リソース（CDN、外部フォント、外部画像など）を読み込む形に変更しないこと。
このページは単体で完結していることが、平文を外部に出さない保証の一部である。
6. 入力された平文を、保存・送信・ログ出力しないこと。送信されるのは暗号文だけ。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シークレット変換</title>
<style>
body { font-family: sans-serif; margin: 2em auto; max-width: 560px; padding: 0 1em; line-height: 1.6;}
h1 { font-size: 1.3em;}
label { display: block; margin-top: 1.2em; font-weight: bold;}
input { width: 100%; box-sizing: border-box; padding: 0.6em; margin-top: 0.3em; font-size: 1em;}
button { margin-top: 1.5em; padding: 0.7em 1.6em; font-size: 1em; cursor: pointer;}
.note { background: #eef7ee; border: 1px solid #bcd8bc; border-radius: 6px; padding: 0.8em 1em;}
#status { margin-top: 1.2em; white-space: pre-wrap;}
#fallback { display: none; margin-top: 1.2em;}
#fallback textarea { width: 100%; box-sizing: border-box; height: 7em;}
</style>
</head>
<body>
<h1>🔐 シークレット変換</h1>
<p class="note">入力した内容は、<strong>このブラウザの中で暗号化</strong>されてから送信されます。
平文のまま外に出ることはありません。チャットに貼る必要もありません。</p>

<label for="webhook">Discord Webhook URL</label>
<input id="webhook" type="text" autocomplete="off" spellcheck="false" placeholder="https://discord.com/api/webhooks/...">

<label for="apikey">YouTube Data API キー</label>
<input id="apikey" type="password" autocomplete="off" placeholder="AIza...">

<button id="send" type="button">暗号化して送信</button>
<div id="status"></div>

<div id="fallback">
<p>スペースへの送信に失敗しました。代わりに、次の暗号文をそのまま Muse に渡してください（暗号文なので、そのまま貼って大丈夫です）。</p>
<textarea id="ciphertext" readonly></textarea>
</div>

<script>
"use strict";

/* ===== 暗号化コア（変更禁止） ===== */
const PUBLIC_KEY_SPKI_B64 = "__PUBLIC_KEY_SPKI_B64__";

function b64ToBytes(b64) {
const bin = atob(b64);
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
return bytes;
}

function bytesToB64(bytes) {
let bin = "";
for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
return btoa(bin);
}

async function encryptValue(plainText) {
const der = b64ToBytes(PUBLIC_KEY_SPKI_B64);
const key = await crypto.subtle.importKey(
"spki", der.buffer,
{ name: "RSA-OAEP", hash: "SHA-256"},
false, ["encrypt"]
);
const data = new TextEncoder().encode(plainText);
const ct = await crypto.subtle.encrypt({ name: "RSA-OAEP"}, key, data);
return bytesToB64(new Uint8Array(ct));
}

async function encryptSecrets(webhookUrl, apiKey) {
return {
webhook_ct: await encryptValue(webhookUrl),
apikey_ct: await encryptValue(apiKey)
};
}
/* ===== 暗号化コアここまで ===== */

/* ===== 画面まわり ===== */
if (typeof document!== "undefined") {
const statusEl = document.getElementById("status");
document.getElementById("send").addEventListener("click", async () => {
const webhook = document.getElementById("webhook").value.trim();
const apikey = document.getElementById("apikey").value.trim();
if (!webhook ||!apikey) {
statusEl.textContent = "両方とも入力してください。";
return;
}
statusEl.textContent = "暗号化しています…";
let result;
try {
result = await encryptSecrets(webhook, apikey);
} catch (e) {
statusEl.textContent = "暗号化に失敗しました。ページを再読み込みして、もう一度お試しください。";
return;
}
/* 入力欄の平文は早めに消す */
document.getElementById("webhook").value = "";
document.getElementById("apikey").value = "";

if (typeof window.__saveCiphertext === "function") {
try {
await window.__saveCiphertext(result.webhook_ct, result.apikey_ct);
statusEl.textContent = "✅ 送信できました。チャットに戻って、Muse に「送った」と伝えてください。";
return;
} catch (e) {
/* フォールバック表示へ進む */
}
}
document.getElementById("ciphertext").value =
"webhook_ct: " + result.webhook_ct + "\n" + "apikey_ct: " + result.apikey_ct;
document.getElementById("fallback").style.display = "block";
statusEl.textContent = "";
});
}
</script>
</body>
</html>
